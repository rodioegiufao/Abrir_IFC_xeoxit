<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador BIM com Medição de Ângulo e Distância</title>
    
    <link id="modeStylesheet" rel="stylesheet" href="styles.css">
    
    <script type="module" src="https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk@latest/dist/xeokit-sdk.min.es.js"></script>
</head>
<body>
    <canvas id="meuCanvas"></canvas>␊

    <canvas id="myNavCubeCanvas"></canvas>␊

    <div id="toolbar">
        <button
            id="btnAngle"
            class="tool-button"
            onclick="setMeasurementMode('angle', this)"
            title="Medir Ângulo (Transferidor)"
        >
            <span style="font-size: 1.2em;">📐</span>
            Ângulo
        </button>

        <button 
            id="btnDistance" 
            class="tool-button" 
            onclick="setMeasurementMode('distance', this)" 
            title="Medir Distância (Régua)"
        >
            <span style="font-size: 1.2em;">📏</span>
            Distância
        </button>

        <button 
            id="btnDeactivate" 
            class="tool-button" 
            onclick="setMeasurementMode('none', this)" 
            title="Desativar Medição"
        >
            <span style="font-size: 1.2em;">🚫</span>
            Desativar
        </button>
        
        <button 
             id="btnToggleTree"
            class="tool-button"
            onclick="toggleTreeView()"
            title="Mostrar/Esconder Pavimentos"
        >
            <span style="font-size: 1.2em;">🏢</span>
            Pavimentos
        </button>

        <button
            id="btnGrid"
            class="tool-button"
            onclick="toggleGrid()"
            title="Mostrar/Esconder Grade no Solo"
        >
            <span style="font-size: 1.2em;">🟩</span>
            Grade
        </button>

        <button
            id="btnSectionPlane"
            class="tool-button"
            onclick="toggleSectionPlane(this)"
            title="Plano de Corte (Horizontal)"
        >
            <span style="font-size: 1.2em;">🔪</span>
            Corte
        </button>
    </div>
    <div id="treeViewContainer"></div>
    <div id="modeSwitcher" aria-label="Alternar modo de visualização">
        <button type="button" class="mode-button active" data-mode="desktop">Versão Computador</button>
        <button type="button" class="mode-button" data-mode="tablet">Versão Tablet (Vertical)</button>
        <button type="button" class="mode-button" data-mode="mobile">Versão Celular</button>
    </div>
    <script type="module" src="app.js"></script>
    <script>
        const modeStylesheet = document.getElementById('modeStylesheet');
        const modeButtons = document.querySelectorAll('#modeSwitcher [data-mode]');

        function applyMode(mode) {
            let stylesheet = 'styles.css';

            if (mode === 'mobile') {
                stylesheet = 'styles-mobile.css';
            } else if (mode === 'tablet') {
                stylesheet = 'styles-tablet.css';
            }
            if (modeStylesheet.getAttribute('href') !== stylesheet) {
                modeStylesheet.setAttribute('href', stylesheet);
            }

            modeButtons.forEach((button) => {
                button.classList.toggle('active', button.dataset.mode === mode);
            });

            localStorage.setItem('preferredMode', mode);
        }

        modeButtons.forEach((button) => {
            button.addEventListener('click', () => applyMode(button.dataset.mode));
        });

        applyMode(localStorage.getItem('preferredMode') || 'desktop');
    </script>
</body>
</html>
